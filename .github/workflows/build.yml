# Every push and pull request: build the app, so a broken commit shows up before a release.
name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-python@v6 # the phone app bundles Python 3.10 + spaCy (Chaquopy needs the same version)
        with:
          python-version: "3.10"
      - run: ./gradlew :app:assembleDebug :mobile:assembleDebug --console=plain
