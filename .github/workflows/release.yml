# Push a tag vX.Y.Z -> a signed APK on the repo's Releases page. The app checks the latest release when it
# starts and offers to update. The annotated tag's message becomes the release notes the app shows.
#   git tag -a v0.2.0 -m "What changed"; git push origin v0.2.0
# Secrets (Settings > Secrets and variables > Actions): KEYSTORE_BASE64 (the .jks, base64),
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tag's message, for the release notes
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Release key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          KUMAPIE_KEYSTORE: ${{ runner.temp }}/release.jks
          KUMAPIE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KUMAPIE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KUMAPIE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain -PversionName="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "kumapie-tv-${GITHUB_REF_NAME}.apk"

      - name: Check the APK is signed with the release key
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "kumapie-tv-${GITHUB_REF_NAME}.apk" | head -3

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "kumapie-tv-${GITHUB_REF_NAME}.apk" \
            --title "kumapie ${GITHUB_REF_NAME}" --notes-from-tag
